<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#1a1a2e" id="theme-color-meta"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Flowly"/>
  <title>Flowly</title>
  <link rel="manifest" href="manifest.json"/>
  <link rel="apple-touch-icon" href="icons/icon-180.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(regs => {
        regs.forEach(reg => reg.unregister());
      });
      caches.keys().then(keys => {
        keys.filter(k => k !== 'flowly2-v6').forEach(k => caches.delete(k));
      });
    }
  </script>
</head>
<body>

<!-- SPLASH -->
<div id="splash">
  <div class="splash-inner">
    <img src="icons/icon-180.png" class="splash-logo" alt="Flowly"/>
    <p class="splash-wordmark">flowly</p>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">

  <!-- ── HOY ── -->
  <div id="view-hoy" class="view active">
    <div class="hoy-header">
      <div class="hoy-header-top">
        <div>
          <p class="hoy-label" id="hoy-date"></p>
          <h1 class="hoy-title" id="hoy-greeting"></h1>
        </div>
        <div class="streak-badge" onclick="navigate('perfil')">
          <span class="streak-fire">🔥</span>
          <span class="streak-count" id="streak-badge-count">0</span>
        </div>
      </div>
    </div>

    <div class="scroll-area" id="hoy-scroll">
      <div id="hoy-routines-list"></div>
      <div id="hoy-empty" class="empty-hoy hidden">
        <p class="empty-hoy-emoji">🌿</p>
        <p class="empty-hoy-title">Sin rutinas todavía</p>
        <p class="empty-hoy-sub">Crea tu primera rutina en la sección Biblioteca</p>
        <button class="btn-primary" onclick="navigate('biblioteca')" style="margin-top:20px">Ir a Biblioteca</button>
      </div>
      <div style="height:32px"></div>
    </div>
  </div>

  <!-- ── BIBLIOTECA ── -->
  <div id="view-biblioteca" class="view">
    <div class="lib-header">
      <h1 class="view-title">Biblioteca</h1>
      <div style="display:flex;gap:8px">
        <button class="pill-tab active" id="tab-rutinas" onclick="switchTab('rutinas')">Rutinas</button>
        <button class="pill-tab" id="tab-ejercicios" onclick="switchTab('ejercicios')">Ejercicios</button>
      </div>
    </div>

    <!-- Rutinas panel -->
    <div id="panel-rutinas" class="lib-panel scroll-area">
      <button class="add-card" onclick="openCreateRoutine()">
        <span class="add-card-icon">+</span>
        <span>Nueva rutina</span>
      </button>
      <div id="routine-list"></div>
      <div style="height:32px"></div>
    </div>

    <!-- Ejercicios panel -->
    <div id="panel-ejercicios" class="lib-panel scroll-area hidden">
      <button class="add-card" onclick="openExerciseForm()">
        <span class="add-card-icon">+</span>
        <span>Nuevo ejercicio</span>
      </button>
      <div id="exercise-list"></div>
      <div style="height:32px"></div>
    </div>
  </div>

  <!-- ── PERFIL ── -->
  <div id="view-perfil" class="view">
    <div class="lib-header">
      <h1 class="view-title">Perfil</h1>
    </div>
    <div class="scroll-area">
      <!-- Racha hero -->
      <div class="streak-hero">
        <div class="streak-hero-inner">
          <p class="streak-hero-num" id="streak-hero-num">0</p>
          <p class="streak-hero-label">días de racha</p>
        </div>
        <div class="streak-meta" id="streak-meta"></div>
      </div>
      <!-- Heatmap -->
      <h2 class="section-label">Historial</h2>
      <div class="heatmap-wrap">
        <div class="heatmap-grid" id="heatmap-grid"></div>
        <div class="heatmap-legend">
          <span style="color:var(--text-3);font-size:11px">Menos</span>
          <div class="legend-dot" style="opacity:.2"></div>
          <div class="legend-dot" style="opacity:.5"></div>
          <div class="legend-dot" style="opacity:.8"></div>
          <div class="legend-dot"></div>
          <span style="color:var(--text-3);font-size:11px">Más</span>
        </div>
      </div>
      <!-- Ajustes -->
      <h2 class="section-label" style="margin-top:28px">Personalización</h2>
      <div class="settings-card">
        <p class="settings-row-label">Color de acento</p>
        <div class="color-palette" id="color-palette"></div>
      </div>
      <!-- Data -->
      <h2 class="section-label" style="margin-top:20px">Datos</h2>
      <div class="data-row">
        <button class="data-btn" onclick="exportData()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Exportar backup
        </button>
        <button class="data-btn" onclick="triggerImport()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          Importar backup
        </button>
      </div>
      <input type="file" id="import-input" accept=".json" style="display:none" onchange="importData(event)"/>
      <div style="height:40px"></div>
    </div>
  </div>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <button class="nav-btn active" data-view="hoy" onclick="navigate('hoy')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      <span>Hoy</span>
    </button>
    <button class="nav-btn" data-view="biblioteca" onclick="navigate('biblioteca')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      <span>Biblioteca</span>
    </button>
    <button class="nav-btn" data-view="perfil" onclick="navigate('perfil')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span>Perfil</span>
    </button>
  </nav>
</div>

<!-- ══ MODAL: EJECUTAR RUTINA ══ -->
<div id="modal-run" class="modal-overlay hidden">
  <div class="run-sheet" id="run-sheet">
    <div class="run-header">
      <div>
        <p class="run-label">Rutina</p>
        <h2 class="run-title" id="run-title"></h2>
      </div>
      <button class="close-btn" onclick="closeRun()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="run-progress-bar"><div class="run-progress-fill" id="run-progress-fill"></div></div>
    <div class="run-body scroll-area" id="run-body"></div>
    <div class="run-footer">
      <p class="run-footer-count" id="run-footer-count"></p>
      <button class="btn-primary full-btn" id="run-complete-btn" onclick="completeRun()">Marcar sesión completa</button>
    </div>
  </div>
</div>

<!-- ══ MODAL: CREAR/EDITAR RUTINA ══ -->
<div id="modal-routine" class="modal-overlay hidden">
  <div class="form-sheet" id="routine-sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <h2 class="sheet-title" id="routine-form-title">Nueva rutina</h2>
      <button class="close-btn" onclick="closeRoutineForm()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="form-scroll">
      <div class="form-group">
        <label class="form-label">Nombre</label>
        <input type="text" id="routine-name" class="form-input" placeholder="Ej: Estiramiento nocturno"/>
      </div>
      <div class="form-group">
        <label class="form-label">Descripción <span class="optional">opcional</span></label>
        <input type="text" id="routine-desc" class="form-input" placeholder="Para antes de dormir…"/>
      </div>
      <div class="form-group">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
          <label class="form-label" style="margin:0">Ejercicios</label>
          <button class="btn-ghost-small" onclick="openExPicker()">+ Agregar</button>
        </div>
        <div id="routine-ex-list"></div>
      </div>
      <button class="btn-primary full-btn" onclick="saveRoutine()" style="margin-top:8px">Guardar rutina</button>
      <div style="height:24px"></div>
    </div>
  </div>
</div>

<!-- ══ MODAL: PICKER EJERCICIOS ══ -->
<div id="modal-picker" class="modal-overlay hidden">
  <div class="form-sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <h2 class="sheet-title">Agregar ejercicios</h2>
      <button class="close-btn" onclick="closePicker()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="form-scroll">
      <input type="text" class="form-input" id="picker-search" placeholder="Buscar ejercicio…" oninput="renderPicker()" style="margin-bottom:12px"/>
      <div id="picker-list"></div>
      <button class="btn-primary full-btn" onclick="confirmPicker()" style="margin-top:12px">Confirmar</button>
      <div style="height:24px"></div>
    </div>
  </div>
</div>

<!-- ══ MODAL: CREAR/EDITAR EJERCICIO ══ -->
<div id="modal-exercise" class="modal-overlay hidden">
  <div class="form-sheet" id="exercise-sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <h2 class="sheet-title" id="exercise-form-title">Nuevo ejercicio</h2>
      <button class="close-btn" onclick="closeExerciseForm()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="form-scroll">
      <div class="form-group">
        <label class="form-label">Nombre del ejercicio</label>
        <input type="text" id="ex-name" class="form-input" placeholder="Ej: Rotación de cadera"/>
      </div>
      <div class="form-group">
        <label class="form-label">Zona del cuerpo</label>
        <div class="body-zones" id="body-zones"></div>
      </div>
      <div class="form-group">
        <label class="form-label">Tipo</label>
        <div class="type-toggle">
          <button class="type-btn active" id="type-btn-time" onclick="selectType('time')">⏱ Tiempo</button>
          <button class="type-btn" id="type-btn-reps" onclick="selectType('reps')">🔁 Repeticiones</button>
        </div>
      </div>
      <div id="type-time-fields" class="form-group">
        <label class="form-label">Duración (segundos)</label>
        <input type="number" id="ex-duration" class="form-input" placeholder="30" min="5" max="600"/>
        <label class="form-label" style="margin-top:12px">Series</label>
        <input type="number" id="ex-sets-time" class="form-input" placeholder="2" min="1" max="20"/>
      </div>
      <div id="type-reps-fields" class="form-group hidden">
        <label class="form-label">Repeticiones</label>
        <input type="number" id="ex-reps" class="form-input" placeholder="10" min="1" max="200"/>
        <label class="form-label" style="margin-top:12px">Series</label>
        <input type="number" id="ex-sets-reps" class="form-input" placeholder="2" min="1" max="20"/>
      </div>
      <div class="form-group">
        <label class="form-label">Notas <span class="optional">opcional</span></label>
        <textarea id="ex-notes" class="form-input form-textarea" placeholder="Cómo realizarlo, tips…"></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">Imagen de referencia <span class="optional">opcional</span></label>
        <div class="img-upload-area" id="img-upload-area" onclick="triggerImgUpload()">
          <div id="img-preview-wrap">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
            <p style="font-size:12px;color:var(--text-3);margin-top:6px">Toca para agregar foto</p>
          </div>
        </div>
        <input type="file" id="img-input" accept="image/*" style="display:none" onchange="handleImgUpload(event)"/>
        <button class="btn-ghost-small" id="img-remove-btn" style="display:none;margin-top:8px;color:#ef4444" onclick="removeImg()">Eliminar imagen</button>
      </div>
      <button class="btn-primary full-btn" onclick="saveExercise()">Guardar ejercicio</button>
      <button class="btn-ghost-danger" id="ex-delete-btn" style="display:none" onclick="deleteExercise()">Eliminar ejercicio</button>
      <div style="height:24px"></div>
    </div>
  </div>
</div>

<!-- ══ MODAL: DETALLE EJERCICIO (desde run) ══ -->
<div id="modal-ex-detail" class="modal-overlay hidden" onclick="closeExDetail(event)">
  <div class="form-sheet">
    <div class="sheet-handle"></div>
    <div id="ex-detail-content"></div>
    <div style="height:24px"></div>
  </div>
</div>

<!-- TOAST -->
<div id="toast" class="toast hidden"></div>

<!-- CONFETTI CANVAS -->
<canvas id="confetti-canvas" style="position:fixed;inset:0;pointer-events:none;z-index:999;display:none"></canvas>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
